server:
  port: 8080

spring:
  application:
    name: spring-boot-initial

  datasource:
    url: jdbc:mysql://localhost:3306/java_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml

# JWT 配置
jwt:
  # HS256 签名密钥（长度必须 >= 32 字节，生产环境请改成自己的随机值）
  secret: gnail-admin-jwt-secret-key-please-change-me-0123456789abcdef
  # token 有效期（毫秒），默认 24 小时
  expiration: 86400000